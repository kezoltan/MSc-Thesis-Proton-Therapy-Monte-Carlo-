[build-system]
requires = ["setuptools", "wheel"] # setuptools and wheel are necessary for the build

[project]
name = "pbt-mlmc"
version = "0.1"
description = "Monte Carlo methods for proton beam therapy dose estimation"
requires-python = ">=3.11"
authors = [
    {name = "Katie Zoltan", email = "katherine.zoltan@bnc.ox.ac.uk"}
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
dependencies = ["numpy", "matplotlib", "scipy", "numba"]

[project.scripts]
pbt-mlmc = "pbt_mlmc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pbt_mlmc = ["example_config.toml"]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ruff",
]
docs = [
    "sphinx",
    "shibuya",
    "myst-parser"
]

[tool.ruff]
line-length = 120
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
# Ignore F403 (star imports) and F405 (names that may be undefined due to star imports).
ignore = ["F403", "F405", "E741", "B905", "B028", "F841"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
testpaths = ["test/unit_tests"]

[tool.coverage.run]
source = ["pbt_mlmc"]
