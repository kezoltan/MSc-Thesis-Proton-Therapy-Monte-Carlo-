name: Code coverage

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  codecov-test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup python
        uses: actions/setup-python@v7

      - name: Install dependencies
        run: |
          python -m pip install .[dev]

      - name: Generate coverage report
        run: |
          echo "Coverage exclusions (configured in pyproject.toml):"
          grep -A 10 '^\[tool.coverage.run\]' pyproject.toml
          pytest --cov --cov-branch --cov-report=xml --cov-report=html

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          files: pbt_mlmc_coverage.xml

      - name: Store coverage report as artifact
        uses: actions/upload-artifact@v7
        with:
          name: html-coverage-report
          path: htmlcov/
          retention-days: 2